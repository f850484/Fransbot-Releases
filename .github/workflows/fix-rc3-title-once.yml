name: Fix RC3 release title once

on:
  push:
    paths:
      - '.github/workflows/fix-rc3-title-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Normalize RC3 title
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v1.32.0-rc.3 --repo "$GITHUB_REPOSITORY" --title "Fransbot: Rearmed - Release Candidate 3"